name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,live]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  # The self-contained promise: base install (no [live] extra, no checkout,
  # no credentials) must boot and serve the offline tools from the bundled
  # content snapshot, and live tools must return the structured offline answer.
  minimal-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: |
          cd /tmp  # away from the checkout so only the bundled snapshot is in reach
          python - <<'EOF'
          from anaplan_kit_mcp import kitindex, server

          root = kitindex.find_kit_root()
          assert kitindex.kit_commit(root), f"expected the bundled snapshot, got {root}"
          assert server.formula_reference("TIMESUM")["found"] is True
          assert server.search_kit("rolling forecast")["results"]
          offline = server.anaplan_list_workspaces()
          assert offline == {"mode": "offline", "error": "no Anaplan credentials configured", "hint": offline["hint"]}
          print("minimal install OK: bundled content served, live tools honest-offline")
          EOF
